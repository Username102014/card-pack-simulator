<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Card Roller</title>
  <link rel="stylesheet" href="styles.css">
  <script src="script.js" defer></script>
</head>
<body>
  <div id="app">
    <h1>🎴 Card Roller</h1>

    <div class="buttons">
      <button id="openBtn">Open Pack</button>
      <button id="inventoryBtn">Toggle Inventory</button>
    </div>

    <div id="ripOverlay" class="overlay hidden">Opening Pack...</div>

    <div id="cardStage"></div>
    <div id="packWrapper" class="hidden"></div>

    <div id="inventoryPanel" class="hidden">
      <h2>Your Inventory</h2>
      <div id="inventoryList" class="inventory-list"></div>
    </div>
  </div>
</body>
</html>
