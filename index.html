<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Gradient Pack</title>
  <link rel="stylesheet" href="styles.css" />
  <script src="script.js" defer></script>
</head>
<body>
  <div id="app">
    <h1>Gradient Pack</h1>

    <div class="stats">
      <div>💰 Coins: <span id="coins">0</span></div>
      <div>⏱️ Money/sec: <span id="mps">0</span></div>
    </div>

    <div class="buttons">
      <button id="openBtn">Open Pack</button>
      <button id="inventoryBtn">Inventory</button>
      <button id="autosellBtn">Autosell Settings</button>
    </div>

    <div id="ripOverlay" class="overlay hidden">Opening Pack...</div>

    <div id="cardStage"></div>
    <div id="packWrapper" class="hidden"></div>

    <!-- Inventory Panel -->
    <div id="inventoryPanel" class="panel hidden">
      <h2>Your Inventory</h2>
      <input type="text" id="inventorySearch" placeholder="Search cards..." />
      <div id="inventoryList" class="inventory-list"></div>
      <div class="panel-actions">
        <button id="sellSelectedBtn" class="sell-btn">Sell Selected</button>
        <button id="sellAllBtn" class="sell-btn">Sell All</button>
      </div>
    </div>

    <!-- Autosell Settings -->
    <div id="autosellPanel" class="panel hidden">
      <h2>Autosell Settings</h2>
      <p>Select cards that will automatically sell when received:</p>
      <div id="autosellList" class="inventory-list"></div>
      <div class="panel-actions">
        <button id="closeAutosellBtn" class="secondary-btn">Close</button>
      </div>
    </div>
  </div>
</body>
</html>
