<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Gradient Pack Simulator</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <h1>🎴 Gradient Pack Opener</h1>
  <button id="openBtn">Open Pack</button>
  <button id="inventoryBtn">Inventory</button>

  <div id="ripOverlay" class="rip-overlay hidden">
    <div class="rip-effect">🛍️ Ripping pack...</div>
  </div>

  <div id="cardStage" class="stage"></div>
  <div id="packWrapper" class="wrapper hidden"></div>

  <div id="inventoryPanel" class="hidden">
    <h2>🗃️ Inventory (Max 30)</h2>
    <div id="inventoryList"></div>

    <h3>⚙️ Autosell Settings</h3>
    <div id="autosellSettings"></div>
  </div>

  <!-- ✅ Link to your JavaScript file -->
  <script src="script.js"></script>
</body>
</html>
