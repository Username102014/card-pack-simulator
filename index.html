<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Gradient Pack</title>
  <link rel="stylesheet" href="styles.css" />
  <script src="script.js" defer></script>
</head>
<body>
  <div id="app">
    <h1>Gradient Pack</h1>

    <div class="stats">
      <div>💰 Coins: <span id="coins">0</span></div>
      <div>⏱️ Money/sec: <span id="mps">0</span></div>
    </div>

    <div class="buttons">
      <button id="openBtn">Open Pack</button>
      <button id="inventoryBtn">Inventory</button>
      <button id="autosellBtn">Autosell</button>
    </div>

    <div id="ripOverlay" class="overlay hidden">Opening Pack...</div>
    <div id="cardStage"></div>
    <div id="packWrapper" class="hidden"></div>

    <div id="inventoryPanel" class="hidden panel">
      <h2>Your Inventory</h2>
      <div id="inventoryList" class="inventory-list"></div>
      <button id="sellSelectedBtn" class="sell-btn">Sell Selected</button>
    </div>

    <div id="autosellPanel" class="hidden panel">
      <h2>Autosell Settings</h2>
      <div id="autosellList" class="inventory-list"></div>
      <button id="closeAutosellBtn">Close</button>
    </div>
  </div>
</body>
</html>
